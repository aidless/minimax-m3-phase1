# Offline regression plus the synthetic-fixture eval.
#
# Triggers on push to main/master and on every pull request. Path filters were
# removed so this badge workflow runs the same `make check` as pr-checks.yml.
#
# The weekly schedule stays removed. It failed unattended through 2026-07 to
# 2026-09 and the repo is not staffed for a cron.
#
# `make check` is stdlib Python: K-conflict tree, 15-case suite, eval/run_cases.py,
# the synthetic fixture eval, and the cited-number classifier. No network.

name: K Conflict Decision Tree Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  test-k-conflict:
    name: make check (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: make check
        run: make check

  test-on-windows:
    name: make check (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: scripts/check.sh
        shell: bash
        run: bash scripts/check.sh
