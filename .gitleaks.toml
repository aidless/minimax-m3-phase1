# aidless 高风险仓泄露防线 —— 与 gitleaks v8.x 默认规则叠加生效
title = "aidless custom secret rules"

[[rules]]
id = "api2d-forward-key"
description = "api2d forward key (fk...)"
regex = '''fk[0-9a-f]{5,12}-[0-9A-Za-z]{10,}'''
tags = ["key", "api2d"]

[[rules]]
id = "dashscope-bailian-key"
description = "Alibaba DashScope / Bailian API key"
regex = '''sk-[a-zA-Z0-9]{32}'''
tags = ["key", "dashscope", "bailian"]

[[rules]]
id = "deepseek-key"
description = "DeepSeek API key"
regex = '''sk-[a-f0-9]{32}'''
tags = ["key", "deepseek"]

[[rules]]
id = "openai-style-key"
description = "OpenAI-style project key"
regex = '''sk-[A-Za-z0-9_-]{40,}'''
tags = ["key", "openai"]

# 历史遗留：11903ad (2026-07-10) 曾在部署手册里贴入真实 key，该行已在 tip 脱敏，
# 但 commit 永久留在历史里。此豁免只绑定「这一条规则 + 这一个 commit + 这一个路径」，
# 不携带密文，也不覆盖其它 commit 或同路径的未来提交。
[[rules.allowlists]]
description = "legacy 11903ad only: rotated/removed key, sanitized at tip"
condition = "AND"
commits = ["11903ad5a4b5915cf42afd9ec4cbacf1a06a656f"]
paths = ['''^_inbox/方法论/Zotero_阶段1_部署手册\.md$''']

[[rules]]
id = "github-pat"
description = "GitHub personal access token"
regex = '''gh[pousr]_[A-Za-z0-9]{36,255}'''
tags = ["key", "github"]

[allowlist]
description = "占位符与示例值"
regexes = [
  '''sk-xxxx''',
  '''CHANGE-ME''',
  '''your[_-]?api[_-]?key''',
  '''<YOUR_.*?>''',
  '''\\$\\{[A-Z_]+\\}''',
]
